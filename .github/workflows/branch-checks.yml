name: Project checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POCS_LIGHTRAG_REAL_TEST: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-demo.txt
            requirements-lightrag-client.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-demo.txt

      - name: Check dependencies
        run: python -m pip check

      # PR checkout includes main. Older feature branches can lack PR #6 tests;
      # main and PRs targeting main must discover a non-empty suite.
      - name: Check Parser and Adapter
        if: ${{ github.event_name == 'pull_request' || github.ref_name == 'main' || hashFiles('test/unit/document_processing/test_*.py') != '' }}
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover(
              'test/unit/document_processing', pattern='test_*.py'
          )
          if suite.countTestCases() == 0:
              raise SystemExit('Parser/Adapter tests are required but none were found')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Check metadata screening and candidate downloads
        if: ${{ hashFiles('test/data_suite/test_*.py') != '' }}
        run: python -m unittest discover -s test/data_suite -v

      - name: Check schema
        run: python -m unittest discover -s test/schema_suite -v

      - name: Check context integration
        run: python -m unittest discover -s test/context_suite -v

      - name: Check DOCX demo
        run: python -m unittest discover -s test/demo_suite -v

      - name: Check handoff fixtures
        run: python -m unittest discover -s test/handoff_suite -v

  web-demo:
    name: Web demo checks
    # Playwright 1.58 has Chromium headless binaries for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci-web.txt
            requirements-demo.txt
            requirements.txt
            requirements-lightrag-client.txt
      - run: python -m pip install -r requirements-ci-web.txt
      - run: python -m playwright install --with-deps --only-shell chromium
      - name: Build a small graph from real DOCX
        run: python -m backend.document_graph_cli --mode graph --output-dir "$RUNNER_TEMP/graph-pilot"
      - name: Open web demo and verify graph and DOCX upload
        run: >
          python -m test.ci.web_smoke
          --graph-file "$RUNNER_TEMP/graph-pilot/document-graph.json"
          --output-dir "$RUNNER_TEMP/web-check"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-demo-checks
          path: |
            ${{ runner.temp }}/web-check/web-summary.json
            ${{ runner.temp }}/web-check/failure.png
            ${{ runner.temp }}/web-check/trace.zip

  corpus:
    name: Corpus integrity
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the corpus needs rebuilding
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$PUSH_BEFORE"
          if [[ "$EVENT" == pull_request ]]; then
            base="$PR_BASE"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            base="$(git merge-base origin/main HEAD)"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$base" HEAD | grep -E '^(data/legal-dataset-study/|backend/app/context/(document_graph|corpus_document_graph|document_graph_view)\.py$|backend/app/document_processing/|backend/document_graph_cli\.py$|backend/shared_demo\.py$|frontend/|test/ci/|requirements.*\.txt$|\.github/workflows/branch-checks\.yml$)' >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No corpus, graph, frontend or CI changes. Full rebuild not required."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-demo.txt
            requirements.txt
            requirements-lightrag-client.txt
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "24"
      - if: steps.scope.outputs.run == 'true'
        run: python -m pip install -r requirements-demo.txt
      - name: Rebuild the full DOCX corpus
        if: steps.scope.outputs.run == 'true'
        run: python -m backend.document_graph_cli --mode corpus --output-dir "$RUNNER_TEMP/corpus-check"
      - name: Check catalogue, source evidence and deleted files
        if: steps.scope.outputs.run == 'true'
        env:
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          args=()
          if [[ -n "$BASE" ]]; then args=(--base "$BASE"); fi
          python -m test.ci.corpus_integrity --graph-dir "$RUNNER_TEMP/corpus-check" "${args[@]}"
      - name: Verify cached drawing on the full graph
        if: steps.scope.outputs.run == 'true'
        run: >
          node test/ci/graph-performance.mjs
          "$RUNNER_TEMP/corpus-check/document-graph.json"
          "$RUNNER_TEMP/corpus-check/performance-summary.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        with:
          name: corpus-checks
          path: |
            ${{ runner.temp }}/corpus-check/integrity-summary.json
            ${{ runner.temp }}/corpus-check/performance-summary.json
